name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # v1.12.6(m1) + v1.12.6（终审 Major）：verify.mjs 只做字符串/纯函数断言，
      # **一个用例都不跑**。
      # 终审 FG3 实测：把某个用例包进 `if (false) it(...)`，node --test 仍然
      # 「# tests 399 / # pass 399 / # fail 0 / EXIT=0」——用例静默消失没有任何信号。
      # 终审 Major 再实测（v1.12.6 第四轮按实测口径改正）：`it.skip()` / `t.skip()` 之后
      # TAP 汇总实测是「# tests 4 / # pass 2 / # skipped 2」——即 skip **会**进 `# tests`、
      # **不进** `# pass`，`# skipped` 单独计数。所以**只比 `# tests` 的守卫照样绿**
      # （总数没少、pass 悄悄少一条）；真正拦住第二个 skip 的是下面的 `# pass` 下限。
      # 所以这里同时断言三件事：
      #   ① `# pass >= MIN_TESTS - SKIPPED_ALLOWED`（被删 / 被 if(false) / 被 .skip 都红）；
      #   ② `# cancelled == 0`（取消不是通过）；③ `# todo == 0`（todo 不是通过）。
      # SKIPPED_ALLOWED = 已登记的**准跳**条数，当前 1，来源只有一条：
      #   · test/host-0.2-compat.test.js:334-340（用例起于 334 行，`t.skip` 在 340 行）
      #     —— 它硬编码 `/Users/arming/.nvm/.../dsh-util-values/lib/index.js`：
      #     macOS 开发机上可解析、ubuntu-latest 上必然解析不到 ⇒ 走 `t.skip(...)` + return，
      #     CI 上固定少 1 条 pass（本地不跳，pass 数就是 MIN_TESTS）。
      # 除它之外**不许再有准跳**：新增 skip 会让 CI 红，那时要么删掉 skip、
      # 要么在此登记来源并同步 SKIPPED_ALLOWED，不许直接把下限往下调。
      # MIN_TESTS = `# tests` 计数下限（本地 Node 22 实测；新增用例时一起抬上去）。
      # v1.12.6 第四轮（终审修复）随新增用例上抬：497 → 509（第三轮）→ **518**（第四轮，
      # 危险命令门 +9 条：判据层 6 条、弹框预填 3 条）
      # v1.12.6 第五轮再上抬：518 → **531**（判据层/监听器层 +5：multi-exec 段首 `-exec`、
      # 新包装器 doas/setsid/chroot/ionice/taskset、`source`/`.` 的 shell-source、监听器层
      # 误伤守卫；端点层 +4：M-B 全非法 400 / 真删空工具档 / 合法路径 / 混合声明；
      # 弹框预填 +4：按 cwd 解析、absolutizeDirs、盘根不参与、非绝对路径不勾选三态）
      # v1.12.6 第六轮再上抬：531 → **538**（+7：判据层 3 条 —— 另外 9 个同族包装器
      # unshare/nsenter/strace/firejail/systemd-run/su/runuser/setarch/prlimit、
      # `su`/`runuser` 没有 `-c` 的 su-shell 门、截断边界的字符下标口径；监听器层 3 条 ——
      # 9 个包装器在「已授权 bash」下仍 next()、同一批误伤守卫、commandText 超限的
      # command-too-long 门（含 argsText 只截断的对照）；弹框 1 条 —— resolveAgainstCwd
      # 收到绝对路径直接返回）
      # v1.12.6 第七轮再上抬：538 → **546**（+8：判据层 6 条 —— 大小写折叠阻断的 9 条
      # 碰撞形态、取值选项表**短选项大小写精确**的表驱动用例、既有命中回归清单、
      # 结构性兜底 `wrapper-option-ambiguity`（含 `-exec` 与 argv 拆词两条守卫）、
      # `su`/`runuser` no-`-c` 分支的外层留痕、设计裁定第 10 条的源码级哨兵；
      # 监听器层 2 条 —— 9 条碰撞在「已授权 bash」下仍 next()（含兜底与 m3 留痕）、
      # 同一批误伤守卫仍吃工具名档）
      # Node 版本差异若少算，本守卫会红，那时按 CI 打印的实际数下调并在 CHANGELOG
      # 说明，不要直接删守卫。
      # v1.12.6 第八轮再上抬：546 → **551**（+5：判据层 4 条 —— 欠吃方向 12 条
      # （`env -P` / xargs 的 BSD `-J/-R/-S` / chroot 的 `-u/-g/-G`，含附着形态）、
      # macOS 四个同族包装器（`arch`/`caffeinate`/`script`/`xcrun`）14 条、
      # 欠吃方向的误伤守卫 19 条、**M2**：取值选项表与**字面量**期望清单双向对拍
      # （删条目 ⇒ 红、加条目 ⇒ 红；修复「删条目 = 同时删断言」的测试盲区）；
      # 监听器层 1 条 —— 12 条欠吃形态在「已授权 bash」下仍 next()、无害形态仍 allowed-once）
      # v1.12.7 三轮叠加（每轮都按本地 Node 22 实测的 `# tests` 同步）：
      #   551 → **578**（+27：判据反转/工具档/`~` 展开等第一批）；
      #   → **590**（+12：裁定 A「空路径集先二选一」5 + 通道接线 6 + 裁定 B 三键 1… 见下 ⑤）；
      #   → **593**（+3：终审 M1 端点 `paths:null` 2 + Minor 7 截断 1）。
      #   ① 既有 16 条断言因语义反转被改写（不加条数）：tool-grant-session 7 条、
      #      host-approval-endpoint 4 条、grant-dialog 3 条、invariants-1-12-6 1 条、
      #      dangerous-command-gate 1 条；另有 tool-grant-session 的 handler 注入表
      #      补登记 `isSandboxEscalation`（漏登记会把 4 条用例吞成假红）。
      #   ② 新增 test/invariants-1-12-7.test.js：20 条（不变量①–⑦：越权吃工具档 /
      #      未命中仍弹 / 三门压过工具档 / ACP 孪生仍绕过 / 越权仍不落项目档 /
      #      `~` 按 home 展开 / 拿不到 home 保持现状；含纯函数层与源码级顺序哨兵）。
      #   ③ 新增 test/grant-dialog.test.js 的 v1.12.7 弹框层：4 条（`~` 展开后恢复
      #      默认勾选并随确认发出、cwd 缺失也展开、拿不到 home 原样+不勾选+警示、
      #      `~user/…` 不展开）。
      #   ④ verify.mjs 新增 v1.12.7 断言块（不占用例条数）。
      #   ⑤ v1.12.7 第二轮（裁定 A「空路径集先二选一」/ 裁定 B「0.7.10 三键」）：新增
      #      test/grant-dialog.test.js 二级选择 5 条 + 通道接线 6 条（含全链路两条）、
      #      test/permission-pending.test.js 5 条（含老对端兼容）、verify.mjs 的
      #      v1.12.7-6/-7 断言块（不占用例条数）。
      #   ⑥ 终审收口轮：test/host-approval-endpoint.test.js 新增 2 条（paths:null 不写档 /
      #      无该键时 legacy 逐字不变）、test/permission-pending.test.js 新增 1 条（超长
      #      value/reason 必须截断）；verify.mjs 新增 v1.12.7-8 端点门守卫 + 
      #      `~` 基准来源行的反向断言 + 截断守卫（均不占用例条数）。
      # v1.12.10（**没有任何载荷豁免**：内容规则 + 形状判据对整段文本的每个段/行全量生效）：
      #   ① test/dangerous-command-gate.test.js 的 v1.12.9 describe 整体改写为 v1.12.10：
      #      现场 commit 的期望**翻面**成「必须弹（代价）」；新增 B1 的 11 条算术假起始、
      #      B2 的续行、7 个 shell/su 名 tag、先内容后形状归因；掩码/豁免断言整块删除；
      #      监听器层补 B1/B2/tag 三条 e2e（66 条，与 1.12.9 同数）；
      #   ② 删除 test/invariants-1-12-9.test.js（18 条，为已删机器服务）；
      #      新增 test/invariants-1-12-10.test.js 15 条（5 条不变式：全量判定（数字/标识符两档 +
      #      续行 + 7 tag + 有界截断）/ 不放宽（21 条回归表 + 9 条对照 MISS）/ 先内容后形状 /
      #      **两套豁免机器不得复活**（20 个符号的源码级反向守卫 + matchText 无 continue）/
      #      接线 + 监听器层）；
      #   ③ verify.mjs 的 v1.12.9 断言块（142 行）换成 v1.12.10 块（172 行）：20 个废弃符号
      #      反向守卫、matchText 无跳过、A 组 16 条必须 HIT、B1 11 条（两档）、B2 3 条、
      #      代价 3 类 + 7 tag、对照 5 条 MISS、D 组反放宽 16 条 + argsText、归因顺序 5 条
      #      （不占用例条数）。
      #   ④ 用例条数：593（1.12.7 基线）→ 625（1.12.9）→ **622**（本版：gate 66 不变，
      #      invariants 18→15，删掉 1.12.9 那一份）。
      # v1.12.11（用户裁定：判定前先做**文本归一化**；`contentRuleOf` 加 256 token 归因窗口）：
      #   ① test/dangerous-command-gate.test.js 66 → **74**：B2 从「形状判据」翻成「续行合并 ⇒
      #      内容规则」（`rm -rf` / `git push`）；matchText 标记改链式（`normalized` + 双读）；
      #      新增 v1.12.11 describe 8 条 —— Major 1 续行（含 CRLF / 行尾 `\` 带空格 / 转义边缘）、
      #      Major 2 多行 `-c`/`-Command`、细则⑤ 空白折叠、行首语义不许抹平 + 现场代价、
      #      「双读」不许变松、Blocker 窗口语义、Blocker 性能封顶（32768 包装词 < 500ms）、
      #      Minor 1 大写 tag 两档；
      #   ② test/invariants-1-12-10.test.js 15 条（条数不变）：B2 期望翻成 `rm -rf`/`git push`、
      #      `splitSubCommands` 结构守则更新为「HEAD 骨架 + 换行一律切段」、ban-list 改注释感知；
      #      新增 test/invariants-1-12-11.test.js **15 条**（6 条不变式：归一化函数形状 / 判定在归一化
      #      之后（七条验收 + 空白折叠 + 行首语义 + 反放宽回归表 + 问②未翻面）/ 归因窗口只粗不放
      #      （含性能封顶）/ 大写 tag / 源码级守卫（接线链、换行分支、无按 flag 解析、旧符号不复活）/
      #      监听器层 e2e（续行与多行 `-c` ⇒ next() + 各 1 行门名；无害多行 ⇒ 自动放行 0 留痕））；
      #   ③ verify.mjs：v1.12.10 块的两处标记改链式（规范化 + 双读），新增 v1.12.11 块
      #      （窗口语义与「超限仍拦」、续行 / 多行 / 折叠 / 行首语义 / 大写 tag / 接线 + 双读 +
      #      无按 flag 解析的反向守卫；不占用例条数）；
      #   ④ 用例条数：593（1.12.7 基线）→ 625（1.12.9）→ 622（1.12.10）→ **645**（本版：
      #      gate 66→74，invariants-1-12-10 仍 15，新增 invariants-1-12-11 15）。
      # v1.12.12（用户裁定：**全文子串判定**「文本里出现危险字样就弹」+ 可配置追加串，只增不减）：
      #   ① test/dangerous-command-gate.test.js 74 → **76**：误伤守卫拆成真负例 + 代价两条、
      #      分段测试、`find -exec echo rm -rf`、`yarn info npm publish`、argv 拆词残留边界两条、
      #      监听器层误伤守卫改为 next() + 1 行留痕；
      #   ② 新增 test/invariants-1-12-12.test.js **14 条**（预设三串 × 三位置 / 非预设边界 /
      #      配置项（路径·回退·trim·去重·动态生效·归因名）/ 容差·词边界·字面匹配 / 结构判据不动 /
      #      只做加法回归表 / 代价 / 性能 / 源码级守卫）；
      #   ③ 新增 test/no-relaxation-1-12-12.test.js（「只加不减」常驻反退化回归表 G1–G4）；
      #   ④ verify.mjs 新增 v1.12.12 块（常量与路径口径、预设三串 × 位置、词边界反例、配置四项、
      #      不 reset 的动态生效、字面非正则、结构判据不动、既有覆盖不丢；不占用例条数）；
      # v1.12.13（独立终审 3 阻断 / 3 主要 / 8 次要 —— 只修缺陷，判据方向不动）：
      #   ① test/dangerous-command-gate.test.js 76 → **79**：B1（裸 CR / CRLF / 字面 `\r` 作词间
      #      分隔）、M3（词内引号拼接 `r"m" -rf /tmp/x` ⇒ HIT + 反向不误伤）、M3 边界三条；
      #   ② 新增 test/invariants-1-12-13.test.js **20 条**（B1 最小复现 + 混排、B2 特殊文件
      #      （FIFO / `/dev/zero` 软链 / 目录 ⇒ <50ms 回退）、B3（32,768 字符与 `'a b'×20000`
      #      模式 ⇒ 不抛 + 内置三串照常）、M3、Minor 5 字面转义追加模式、Minor 7 规模上限、
      #      Minor 4 告警口径、源码级守卫）；
      #   ③ test/no-relaxation-1-12-12.test.js 新增 **G5 组 2 条**：CR 家族（生成式 672 条）对
      #      1.12.11 冻结期望位图逐条比对 ⇒ relaxed 必须 0（位图命中数 396 也钉住）；
      #   ④ verify.mjs 新增 v1.12.13 块（B1/B2/B3 的源码 + 行为守卫、M3、Minor 4/5/7；
      #      不占用例条数）；
      #   ⑤ 追加（跨仓纪律三条）：gate +2（`MAX_DANGER_TEXT_CHARS` 恰好等值边界 + 大小写折叠口径）、
      #      invariants-1-12-13 +4（特殊文件八档 + fd 不泄漏 + TOCTOU 子进程探针 + 「类型判定只靠 fd」）；
      #   ⑥ 追加（跨仓常量对齐 256→1024）：invariants-1-12-13 +1（「上限值必须是 1024」）；1025 条用例改写。
      #   ⑦ 追加（终审 M-b/M-c）：invariants-1-12-13 +1（B3 威胁模型「构造不抛、首次 exec 抛 too large」；
      #      M-d 的负缓存**本轮取消实现** ⇒ 不加用例，只订正注释与文档）；
      #      「类型判定只靠 fd」那条改成**源码守卫 + 计数行为牙**（FIFO 档 readSync=0 / statSync=1、
      #      正常档 readSync≥1）；`no-relaxation` 的 G5 与 gate 的 B1 组不动。
      #   ⑧ 用例条数：593（1.12.7 基线）→ … → 667（1.12.12）→ 700（1.12.13）→ **713**（1.12.14：
      #      新增 test/invariants-1-12-14.test.js 12 条；1.12.14 的语义翻转与文案订正净 +1）。
      #   **MIN_TESTS 故意留 2 条余量（713 - 2 = 711）**：`test/host-0.2-compat.test.js` 里有一条硬编码
      #   macOS 路径的用例，在 ubuntu runner 上会 **skip**（`SKIPPED_ALLOWED: 1` 正是为它留的）⇒
      #   CI 实际 pass 期望 712；若把 MIN_TESTS 钉到 713 会因这条 skip 直接红（余量 0 太脆）。
      # 新增用例时请一起把这个数抬上去。
      - name: 单元 / 集成测试（含用例条数守卫）
        env:
          MIN_TESTS: 711
          SKIPPED_ALLOWED: 1
        run: |
          set -uo pipefail
          node --test --test-reporter=tap test/*.test.js > tests.tap
          status=$?
          grep -E '^# (tests|suites|pass|fail|cancelled|skipped|todo) ' tests.tap || echo '（TAP 汇总行缺失）'
          if [ "$status" -ne 0 ]; then
            echo "测试失败（exit=$status）"
            exit "$status"
          fi
          # TAP 汇总行取值：`# tests 507` → 第三列。取不到就让守卫自己红（不许静默放行）
          num() { awk -v k="# $1 " 'index($0,k)==1{print $3; found=1} END{if(!found) print ""}' tests.tap; }
          n=$(num tests); p=$(num pass); c=$(num cancelled); td=$(num todo); sk=$(num skipped)
          if [ -z "$n" ] || [ -z "$p" ]; then
            echo 'Tap 输出里取不到 "# tests" / "# pass" 计数（reporter 变了？守卫已失效，请同步本步骤）'
            exit 1
          fi
          floor=$((MIN_TESTS - SKIPPED_ALLOWED))
          if [ "$p" -lt "$floor" ]; then
            echo "通过用例数 $p < 下限 $floor（= MIN_TESTS $MIN_TESTS - 准跳 $SKIPPED_ALLOWED）：有用例被删除 / 被 if(false) 短路 / 被 .skip（对照终审 FG3 与 .skip 那条 Major）。"
            echo "恢复用例；确属新增准跳时，先在 ci.yml 注释里登记来源并同步 SKIPPED_ALLOWED，再谈下调。"
            exit 1
          fi
          if [ "$n" -lt "$MIN_TESTS" ]; then
            echo "用例数 $n < 下限 $MIN_TESTS：用例总数被静默削减。请恢复用例，或确属删除时同步下调 MIN_TESTS 并在 CHANGELOG 说明原因。"
            exit 1
          fi
          if [ "$c" != "0" ]; then
            echo "有 $c 条用例被取消（cancelled）：取消不是通过，请查清原因。"
            exit 1
          fi
          if [ "$td" != "0" ]; then
            echo "有 $td 条 todo 用例：todo 不是通过，请补完或显式删除。"
            exit 1
          fi
          echo "通过用例数 $p ≥ 下限 $floor（# tests $n ≥ $MIN_TESTS；skipped $sk = 已登记的准跳上限 $SKIPPED_ALLOWED；cancelled $c；todo $td）"
      - run: node verify.mjs
